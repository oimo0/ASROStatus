<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f4fbff">
<meta name="description" content="ASROのサービス稼働状況">
<title>ASRO Status</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="glow g1"></div><div class="glow g2"></div>
<main class="wrap">
<header><a class="brand" href="./"><span class="mark"><i></i><i></i><i></i></span><span>ASRO <b>Status</b></span></a><span class="live"><i></i>STATUS</span></header>
<section class="hero card">
<div id="heroIcon" class="hero-icon">✓</div>
<div><p class="eyebrow">SYSTEM STATUS</p><h1 id="overallTitle">システム状況を確認しています</h1><p id="overallText">ASROの各サービスの状態を取得しています。</p></div>
</section>
<div id="warning" class="warning card hidden"></div>
<section class="section">
<div class="section-head"><div><p class="eyebrow">SERVICES</p><h2>サービス稼働状況</h2></div><span id="updatedAt">最終更新: --</span></div>
<div id="services" class="grid"><div class="skeleton"></div><div class="skeleton"></div></div>
</section>
<section class="section">
<div class="section-head"><div><p class="eyebrow">INFORMATION</p><h2>お知らせ・メンテナンス</h2></div></div>
<div id="notices" class="notices"><article class="empty card">お知らせを確認しています。</article></div>
</section>
<footer>ASRO Status <span>•</span> Powered by ASRO</footer>
</main>
<script src="app.js" defer></script>
</body>
</html>
